<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="Terminal showing sqlguard scan output with three findings">
  <title>sqlguard scan output</title>
  <desc>A terminal window running `sqlguard scan ./internal/...` and reporting a critical delete-without-where, a warning select-star, and a warning leading-wildcard, each with a redacted query, an issue line, and a fix line.</desc>
  <defs>
    <clipPath id="win"><rect x="0" y="0" width="860" height="470" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect width="860" height="470" fill="#0f172a"/>
    <!-- title bar -->
    <rect width="860" height="40" fill="#1e293b"/>
    <circle cx="20" cy="20" r="6" fill="#f87171"/>
    <circle cx="40" cy="20" r="6" fill="#fbbf24"/>
    <circle cx="60" cy="20" r="6" fill="#34d399"/>
    <text x="430" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">sqlguard scan — internal/</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" xml:space="preserve">
    <text x="24" y="72"><tspan fill="#64748b">$</tspan> sqlguard scan ./internal/...</text>

    <text x="24" y="108"><tspan fill="#f87171" font-weight="700">[SQLGUARD CRITICAL]</tspan> delete-without-where</text>
    <text x="24" y="128">  <tspan fill="#94a3b8">File:</tspan>  internal/repo/sessions.go:42</text>
    <text x="24" y="148">  <tspan fill="#94a3b8">Query:</tspan> <tspan fill="#22d3ee">DELETE FROM sessions</tspan></text>
    <text x="24" y="168">  <tspan fill="#94a3b8">Issue:</tspan> DELETE without WHERE clause detected. This will delete all rows.</text>
    <text x="24" y="188">  <tspan fill="#94a3b8">Fix:</tspan>   Add a WHERE clause to limit the scope of the delete.</text>

    <text x="24" y="224"><tspan fill="#fbbf24" font-weight="700">[SQLGUARD WARNING]</tspan> select-star</text>
    <text x="24" y="244">  <tspan fill="#94a3b8">File:</tspan>  internal/repo/users.go:17</text>
    <text x="24" y="264">  <tspan fill="#94a3b8">Query:</tspan> <tspan fill="#22d3ee">SELECT * FROM users WHERE email = ?</tspan></text>
    <text x="24" y="284">  <tspan fill="#94a3b8">Issue:</tspan> SELECT * detected. Selecting all columns can hurt performance.</text>
    <text x="24" y="304">  <tspan fill="#94a3b8">Fix:</tspan>   Select only the columns you need.</text>

    <text x="24" y="340"><tspan fill="#fbbf24" font-weight="700">[SQLGUARD WARNING]</tspan> leading-wildcard</text>
    <text x="24" y="360">  <tspan fill="#94a3b8">File:</tspan>  internal/repo/search.go:88</text>
    <text x="24" y="380">  <tspan fill="#94a3b8">Query:</tspan> <tspan fill="#22d3ee">SELECT id, name FROM products WHERE name LIKE ?</tspan></text>
    <text x="24" y="400">  <tspan fill="#94a3b8">Issue:</tspan> LIKE with leading wildcard detected. Index cannot be used.</text>
    <text x="24" y="420">  <tspan fill="#94a3b8">Fix:</tspan>   Use prefix search or a full-text index.</text>

    <text x="24" y="452"><tspan fill="#94a3b8">3 issue(s) found (17 file(s) scanned)</tspan>   <tspan fill="#64748b">exit 1</tspan></text>
  </g>
</svg>
