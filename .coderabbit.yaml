# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for sqlguard.
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit
#
# The path_instructions below teach CodeRabbit this repo's non-obvious
# invariants (from AGENTS.md) so reviews are relevant and it does NOT flag
# deliberate patterns (e.g. the //nolint deprecated database/sql delegations).

language: en-US

tone_instructions: >-
  Reviewing sqlguard, a near-zero-dependency, security-conscious SQL analyzer
  for Go. Be precise; prioritize correctness, hot-path allocations, concurrency
  safety, and PII redaction. Pre-release: prefer clean redesign over compat shims.

early_access: false

reviews:
  # assertive surfaces more issues — appropriate for a library aiming at a high
  # bar. Switch to "chill" if reviews feel noisy.
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  changed_files_summary: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  # Don't spend review budget on build output or vendored trees.
  path_filters:
    - "!bin/**"
    - "!dist/**"
    - "!**/testdata/**"
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    # Frozen snapshots of website/docs taken at release time. A docs change
    # lands in website/docs only — snapshots are produced by cut-version and
    # are never hand-edited, so any suggestion here is unactionable by
    # definition: a published snapshot documents the behaviour of a shipped
    # version, and changing it rewrites history for users still on it.
    - "!website/versioned_docs/**"
    - "!website/versioned_sidebars/**"
    # Generated raster assets and the logo SVGs; nothing to review as text.
    - "!website/static/**"

  path_instructions:
    - path: "**/*.go"
      instructions: >-
        Go 1.27; modern idioms expected (range-over-int, `any`, compile-time
        interface asserts `var _ I = (*T)(nil)`). Keep the core dependency-light:
        analyzer, middleware and reporter must stay free of third-party deps and
        of YAML. Flag new external imports in those packages. Watch for
        allocations and unnecessary work on the per-query hot path
        (analyzer.Analyze, middleware.Guard.Check). Code must be safe for
        concurrent use where documented (Guard, QueryTracker, the caches).

    - path: "analyzer/**"
      instructions: >-
        Redaction is the default and there is ONE canonical normalizer. Never
        let raw literal values reach a Result that leaves the process:
        Result.Query must be redacted unless rawQuery is explicitly set, and
        Result.Fingerprint must always be PII-free/low-cardinality. Do NOT
        introduce a second normalizer — everything funnels through Redact /
        Fingerprint. The `analyzer` package must NOT import `config` or any YAML
        library. Rules self-register via analyzer.Register in init(); a new rule
        should be a RuleSpec registration, not a hand-maintained list. Rules read
        the normalized Statement, never raw SQL.
        The literal lexers scan under more than one dialect reading and neither
        may be collapsed to a single pass. Redact always treats $tag$...$tag$ as
        a literal and scans twice over the BACKSLASH question, redacting the
        UNION — picking one reading desynchronises the lexer, which then emits
        the FOLLOWING literal's contents as query structure. IsMultiStatement
        takes the opposite side on both counts: it never honors backslash
        escapes and scans twice over the $$ question instead, refusing when ANY
        reading leaves a ';' outside a literal, because each reading is blind to
        a payload the other catches. Note IsMultiStatement is explain's
        stacked-statement guard even though it lives here, and the MySQL
        --allow-dml path runs read-write where DDL implicit-commits past the
        rollback — weakening it is a security bypass, not a refactor.
        stripComments and blankLiterals must agree about dollar quotes; when
        they disagreed, a quote inside a dollar body swallowed a real separator.
        Flag any change that drops a reading, makes the two lexers disagree, or
        removes TestRedactNoLeakAcrossDialectAmbiguity /
        TestIsMultiStatementNeedsBothReadings.

    - path: "middleware/**"
      instructions: >-
        middleware.Guard is the single analysis core (Check / CheckLatency /
        Observe / ResetN1 / Analyzer). All interception points and every
        integration must route through one Guard — flag any hand-rolled
        check/latency logic that bypasses it (it silently loses redaction,
        fingerprints, the parser seam, config, N+1, dedup and the analysis
        cache). The analysis cache is keyed on the EXACT query string (not the
        fingerprint) on purpose: a few rules read literal-derived facts the
        fingerprint folds away. Cached result slices are shared/read-only — do
        not mutate them (see Guard.report). Dedup and N+1 use bounded maps; keep
        them bounded.

    - path: "middleware/driver.go"
      instructions: >-
        This hand-implements the database/sql driver-wrapping chain
        (Driver/DriverContext -> Connector -> Conn -> Stmt/Tx). The deprecated
        delegations (base.Begin, legacy Queryer/Execer, Stmt.Exec/Query) are
        DELIBERATE and carry //nolint:staticcheck — do NOT flag them or suggest
        removing them; driver.Conn and driver.Stmt still require those methods,
        and a faithful wrapper must delegate to whatever the base exposes. The
        optional-interface forwarding (return driver.ErrSkip / documented no-op
        when the base lacks an interface) preserves bare-driver behavior — do not
        "simplify" it away.
        A query must be analyzed exactly once per execution, so every
        interception point here analyzes AFTER calling the base, never before
        (analyzeExecuted), and argument conversion runs first. Whether the
        query ran is knowable only from the base's answer, and two answers mean
        it did not: driver.ErrSkip (the base declined a direct Query/Exec, and
        database/sql falls back to Prepare+Query, re-entering via wStmt —
        go-sql-driver/mysql answers this for every parameterized query unless
        interpolateParams=true) and driver.ErrBadConn (the connection was dead,
        and database/sql retries on another connection up to twice more).
        Analyzing a declined attempt multiplies one logical query by two or
        three; the duplicate finding hides behind the dedup window but the
        inflated N+1 count silently lowers the configured threshold (#67). Flag
        any change that moves analysis ahead of the base call or restores
        Guard.Observe here — Observe is for interception points that are only
        ever told a query ran, i.e. the out-of-tree integrations.

    - path: "integrations/**"
      instructions: >-
        Each integration is a separate Go module so its heavy deps stay opt-in.
        Every integration must build on the exported middleware.Guard
        (pgxguard is the reference). Flag any integration that re-implements
        analysis, redaction or N+1 by hand. Each should expose ResetN1() for
        per-request scoping. Each `require`s a published core version and is
        pointed at the working tree by the root go.work — do NOT suggest adding
        a `replace` directive; no go.mod in this repo has one.

    - path: "parsers/**"
      instructions: >-
        Optional real-grammar parsers, isolated in their own modules so heavy
        parser deps never enter a consumer's build. A parser must never break the
        caller's query path: on a parse failure return the FallbackParser's
        best-effort Statement (Exact=false), not an error. The dialect parsers
        derive structural facts from the AST but intentionally keep MaxInListLen,
        ImplicitCommaJoin and CartesianJoin as fallback heuristics — that carve-
        out is documented, not a bug.
        Structural fields are reset only inside the case for an AST node the
        parser models; any other node returns the fallback's Statement untouched
        with Exact=false, because blanking fields nothing was derived for drops
        findings silently (#81). HasLimit means a row count, not a limit node
        (#82).

    - path: "config/**"
      instructions: >-
        `config` is the ONLY YAML-aware package; nothing else may import YAML and
        nothing should depend on `config`. Parsing is lenient by default (unknown
        keys/rules warn) unless strict:true — preserve that forward-compat
        behavior so a newer config still loads on an older binary.

    - path: "explain/**"
      instructions: >-
        EXPLAIN must never execute the statement: keep the BeginTx +
        always-Rollback, never use ANALYZE, and keep validate()'s comment/string-
        aware multi-statement rejection and SELECT/WITH-only (DML behind
        WithAllowDML) policy. The tx is read-only EXCEPT on MySQL/MariaDB for DML
        (BeginTx ReadOnly: !dml): those servers reject every statement in a READ
        ONLY tx with error 1792, including a planning-only EXPLAIN — do NOT
        "restore" ReadOnly:true there, it breaks WithAllowDML outright. EXPLAIN
        takes no bind params, so concatenation is by design — the defense is
        validate() + the rolled-back tx; do not "fix" it with parameterization.
        The MySQL plan is requested as `EXPLAIN FORMAT=TRADITIONAL` because
        MySQL 9 defaults @@explain_format to TREE (one free-text column); do not
        drop the clause. Plan columns are addressed BY NAME, never by position:
        MariaDB emits 10 columns where MySQL emits 12. The required-column check
        after rows.Columns() makes an unrecognized plan shape a hard error rather
        than a silent zero-issue result; keep it. Rows whose `table` starts with
        `<` are UNION RESULT / derived temporary tables and are skipped on
        purpose. Deliberate carve-out: explain keeps Result.Query (and the inner
        analyzer.Result.Query of its findings) RAW — the user typed the query on
        their own CLI, it never reaches a log/telemetry sink, and Fingerprint is
        still set. Do NOT flag explain findings for not redacting Query; that is
        intended.

    - path: "test/integration/**"
      instructions: >-
        Integration tests for explain/ against live PostgreSQL, MySQL and
        MariaDB, in their own unpublished module so the DB drivers stay out of
        the core import graph. Everything is behind the `integration` build tag,
        so `go test ./...` stays Docker-free — do not suggest removing the tag or
        folding this into the core module. The tabular EXPLAIN output these pin
        is version-dependent, which is precisely why they cannot be unit tests;
        do not suggest replacing them with fixtures or mocks. Tests skip when
        their DSN env var is unset. MySQL and MariaDB cases must run against both
        servers (they share the "mysql" dialect but differ in EXPLAIN output).

    - path: "**/*_test.go"
      instructions: >-
        Use `-race` for anything touching middleware (driver chain, QueryTracker,
        caches are concurrent). Tests for new behavior should also prove the
        failure mode (e.g. a bug-reintroduction check) where practical. errcheck
        is intentionally relaxed in tests.

    - path: "cmd/sqlguard/**"
      instructions: >-
        The CLI. cmd/sqlguard/db.go blank-imports pgx/v5/stdlib and
        go-sql-driver/mysql so `sqlguard explain` can connect; only this
        package imports them, so library consumers of analyzer/middleware never
        link them — do not flag those imports as a core-dependency violation,
        and do not suggest moving them into explain/ (that WOULD put drivers in
        the library import graph).

    - path: "website/docs/**"
      instructions: >-
        Docusaurus source for the unreleased docs. Verify every Go snippet
        compiles against the current API and that every name presented as
        sqlguard's own — option, function, type or rule — matches an exported
        identifier / registered rule name exactly; a wrong name here is a
        support burden, not a typo. That applies to sqlguard's API only:
        identifiers owned by the standard library, a driver, an ORM or a
        database (sql.Open, stdlib.GetConnector, gorm.Plugin,
        interpolateParams, standard_conforming_strings, …) are correct when
        they match upstream, and naming one is not a violation. This site is
        versioned by snapshot, not per release: additive changes are marked
        inline instead of being snapshotted, so check that anything documenting
        a new API carries its version marker — `_0.3+_` appended to an API
        table's description cell, `_Added in 0.3._` opening a prose paragraph,
        or a trailing `// 0.3+` comment inside a code block. Behaviour that
        changed takes `_Changed in 0.3._` plus a line on what it was before.
        See website/VERSIONING.md rules 1 and 2. Do not suggest edits to
        website/versioned_docs; those are frozen release snapshots.

    - path: "website/**/*.{ts,tsx,css,json,mjs}"
      instructions: >-
        Docusaurus site code, linted and formatted by Biome (website/biome.json)
        and type-checked by TypeScript 7 (website/tsconfig.json deliberately
        inlines @docusaurus/tsconfig because TS 7 removed baseUrl). Keep
        docusaurus.config.ts and scripts/cut-version.mjs reading
        MAX_LIVE_VERSIONS from versions.config.json rather than duplicating it.
        Node-side files (config, sidebars, scripts) must not use browser APIs.

  # CodeRabbit can also run linters/scanners and fold results into the review.
  tools:
    golangci-lint:
      enabled: true # uses the repo's .golangci.yml (v2 schema)
      config_file: .golangci.yml
    gitleaks:
      enabled: true # secret scanning — important for a security-adjacent tool
    yamllint:
      enabled: true # also lints test/integration/docker-compose.yml
    actionlint:
      enabled: true # lints .github/workflows/{ci,codeql,docs}.yml
    markdownlint:
      enabled: true # config: .markdownlint-cli2.jsonc (same as `make lint-docs`)
    biome:
      enabled: true # website/ — config: website/biome.json

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  pull_requests:
    scope: auto
